<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Halaman Tidak Ditemukan — Izyan Danish</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #f7f3eb;
      color: #121214;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 1.5rem;
    }
    .card {
      max-width: 420px;
      background: #f9f6f0;
      border: 1px solid #d8d8de;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
    .seal {
      display: inline-block;
      border: 2px solid #b91c1c;
      color: #b91c1c;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 2rem;
      margin: 0 0 0.5rem;
    }
    p {
      color: #4a4a52;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    a {
      display: inline-block;
      background: #121214;
      color: #f9f6f0;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    a:hover {
      background: #b91c1c;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="seal">四〇四</span>
    <h1>404 — Jejak Tinta Terputus</h1>

</body>
</html>
